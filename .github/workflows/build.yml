name: Build Valheim Mod

on:
  push:
    branches:
      - main
      - develop
      - experimental/**
      - ci-testing

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v1.3
      - uses: NuGet/setup-nuget@v2

      - name: Restore
        run: nuget restore

      - name: Build
        run: msbuild YourMod.sln /p:Configuration=Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValheimMod-${{ github.ref_name }}
          path: |
            **/bin/Release/*.dll
